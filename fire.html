<div style="clear:both">
	  <h3>FIRE(d) Calculator</h2>
	  <p> How much money do you need to FIRE(d by school)?</p>
</div>
 

 <h4>Take a breath... </h4>

<!-- Input Fields -->
<label for="A">What's your living expense per month? (e.g., 2000)</label>
<input type="number" id="A" required><br>

<label for="B">What's inflation-adjusted rate of return? (e.g., 0.04)</label>
<input type="number" id="B" required><br>

<label for="C">What's the yearly expense on housing including HOA and property tax? (e.g., 1000)</label>
<input type="number" id="C" required><br>

<label for="D">What's the monthly rent you need to pay? (e.g., 0 if none)</label>
<input type="number" id="D" required><br>

<!-- Button to calculate -->
<button onclick="calculateResult()">Calculate</button>

<h4>You need to save <span id="result">0</span> dollars for FIRE(d)!</h4>

<script>
    function calculateResult() {
        // Get values from the input boxes
        let A = parseFloat(document.getElementById('A').value);
        let B = parseFloat(document.getElementById('B').value);
        let C = parseFloat(document.getElementById('C').value);
        let D = parseFloat(document.getElementById('D').value);

        // Perform the calculation: ((A/B) - E) / (C - 1 - D)
        let result = (((A+900+D)*12+C)/B)/0.88;

		
		result = result.toFixed(0);


        // Display the result
        document.getElementById('result').textContent = result;
    }
</script>
