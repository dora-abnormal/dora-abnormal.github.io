<div style="clear:both">
	  <h3>Publication Calculator</h2>
	  <p> How many papers do you need to write per year?</p>
</div>
 

 <h4>Take a breath... </h4>

<!-- Input Fields -->
<label for="A">How many publications do you need? (a positive number)</label>
<input type="number" id="A" required><br>

<label for="B">What's the probability that a manuscript gets accepted? (0-1)</label>
<input type="number" id="B" required><br>

<label for="C">How long (in years) is your tenure clock? (typically 6)</label>
<input type="number" id="C" required><br>

<label for="D">How long (in years) is a typical publication cycle? (typically 3 in Business)</label>
<input type="number" id="D" required><br>

<label for="E">How many manuscripts do you have from PhD? (a positive number)</label>
<input type="number" id="E" required><br><br>

<!-- Button to calculate -->
<button onclick="calculateResult()">Calculate</button>

<h4>You have  <span id="years">0</span> years to write new papers. </h4>
<h4>You need <span id="result">0</span> new papers per year during your early years!</h4>

<script>
    function calculateResult() {
        // Get values from the input boxes
        let A = parseFloat(document.getElementById('A').value);
        let B = parseFloat(document.getElementById('B').value);
        let C = parseFloat(document.getElementById('C').value);
        let D = parseFloat(document.getElementById('D').value);
        let E = parseFloat(document.getElementById('E').value);

        // Perform the calculation: ((A/B) - E) / (C - 1 - D)
        let result = ((A / B) - E) / (C - 1 - D);
		let years = (C - 1 - D);
		result = result.toFixed(2);

        // Display the result
        document.getElementById('result').textContent = result;
		document.getElementById('years').textContent = years;
    }
</script>
